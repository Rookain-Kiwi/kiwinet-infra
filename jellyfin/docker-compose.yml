###############################################################################
# jellyfin/docker-compose.yml : Serveur Jellyfin
# Projet  : kiwinet.me
# VM      : Debian 13.3 ARM AArch64 (Freebox Delta)
# Image   : jellyfin/jellyfin (officielle) — bascule du 08/09/2026 depuis
#           LinuxServer.io pour bénéficier de Jellyfin 12.0 dès sa sortie
#           (LSIO n'avait pas encore republié son image au moment du switch).
#           Aucune perte d'accélération matérielle dans un sens ou l'autre :
#           ce SoC ARM (Marvell Cortex-A72) n'en a jamais eu de toute façon.
# Accès   : jellyfin.kiwinet.me (HTTPS via Traefik → port 8096 interne)
#           + LAN direct sur port 8096 (découverte auto-discovery clients locaux)
###############################################################################
services:
  # ───────────────────────────────────────────────────────────────────────────
  # JELLYFIN : Media Server — remplace Plex depuis le 07/09/2026
  # Bibliothèques en lecture seule depuis le NAS Freebox (CIFS)
  # Photos et Books évalués avec succès (08/09/2026) — Komga toujours en
  # place en parallèle, décision finale en attente du résultat sur 12.0
  # ───────────────────────────────────────────────────────────────────────────
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    # Image officielle : pas de PUID/PGID (spécifique à LinuxServer.io),
    # on impose directement l'UID/GID du conteneur via Docker
    user: "1000:1000"
    security_opt:
      # AppArmor non disponible sur ce kernel ARM (Freebox Delta)
      # Nécessaire à la recréation du container — transparent au restart
      - apparmor:unconfined
    ports:
      # Exposition LAN directe — accès via IP locale ou VPN WireGuard
      - "8096:8096"
      # Découverte auto des clients sur le réseau local (LAN uniquement,
      # sans impact WAN) — équivalent fonctionnel au GDM de Plex
      - "7359:7359/udp"
    environment:
      TZ: "Europe/Paris"
    volumes:
      # Configuration, métadonnées, base de données — MÊME volume nommé
      # que sous LinuxServer.io, aucune migration de données nécessaire
      - jellyfin-config:/config
      # Médias sur NAS Freebox (montages CIFS persistants via /etc/fstab)
      # Lecture seule : Jellyfin ne doit jamais modifier les fichiers source
      - /mnt/Libraries/TV Shows:/data/tvshows:ro
      - /mnt/Libraries/Movies:/data/movies:ro
      - /mnt/Libraries/Music:/data/music:ro
      - /mnt/Libraries/Photos:/data/photos:ro
      - /mnt/Libraries/Books:/data/books:ro
    networks:
      - proxy
    labels:
      # Exposition HTTPS via Traefik : certificat Let's Encrypt + middleware secure-headers
      # Le port interne 8096 est résolu par le label loadbalancer.server.port
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.kiwinet.me`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.routers.jellyfin.middlewares=secure-headers@file"

# ─────────────────────────────────────────────────────────────────────────────
# RÉSEAUX
# ─────────────────────────────────────────────────────────────────────────────
networks:
  proxy:
    external: true

# ─────────────────────────────────────────────────────────────────────────────
# VOLUMES
# jellyfin-config : données persistantes (config, métadonnées, cache interne)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  jellyfin-config: